name: Deploy to AKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod
      frontend_image_version: 
        description: "Frontend image version to deploy"
        type: string
        required: true
        default: 1.0.0
      backend_image_version: 
        description: "Backend image version to deploy"
        type: string
        required: true
        default: 1.0.0

permissions:
  contents: read
  id-token: write


jobs:
  deploy:
    name: AKS deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}


    env:
      IMAGE_NAME_BACKEND: backend
      IMAGE_NAME_FRONTEND: frontend
      NAMESPACE: cnapp
      ARM_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AKS_CLUSTER: ${{ vars.AKS_CLUSTER }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      FRONTEND_VERSION: ${{ inputs.frontend_image_version }}
      BACKEND_VERSION: ${{ inputs.backend_image_version }}
      AGFC_NAME: ${{ vars.AGFC_NAME }}
      AGFC_FRONTEND_NAME: ${{ vars.AGFC_FRONTEND_NAME }}
      KEYVAULT_NAME: ${{ vars.KEYVAULT_NAME }}
      KEYVAULT_IDENTITY_CLIENT_ID: ${{ vars.KEYVAULT_IDENTITY_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        run: |
          set -euo pipefail

          echo "Azure CLI:"
          az version

          echo "Extensions:"
          az extension list -o table

          echo "Current Azure account:"
          az account show \
            --query '{subscription:id,tenant:tenantId,name:name}' \
            -o yaml

          echo "AKS resource:"
          az aks show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${AKS_CLUSTER}" \
            --query '{id:id,name:name,type:type,location:location}' \
            -o yaml

          echo "Getting credentials:"
          az aks get-credentials \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${AKS_CLUSTER}" \
            --overwrite-existing \
            --debug

      - name: Deploy cnapp to AKS with Azure Key Vault mounted secrets
        shell: bash
        env:
          BACKEND_SECRET_NAME: backend-secret
          FRONTEND_SECRET_NAME: frontend-secret

        run: |
          set -euo pipefail
          
          echo "Deploying to tenant $ARM_TENANT_ID"
      
          export BACKEND_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME_BACKEND}:${BACKEND_VERSION}"
          export FRONTEND_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME_FRONTEND}:${FRONTEND_VERSION}"
      
          for manifest in k8s/cnapp/*.yaml; do
            envsubst < "$manifest" | kubectl apply -f -
          done
      
          kubectl rollout status deployment/backend --namespace "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/frontend --namespace "$NAMESPACE" --timeout=180s

      - name: Get App gw ID
        run: |
          AGFC_ID=$(az network alb show \
            --resource-group $RESOURCE_GROUP \
            --name $AGFC_NAME \
            --query id \
            --output tsv)
          
          echo "AGFC_ID=$AGFC_ID" >> "$GITHUB_ENV"
          echo "AGFC_FRONTEND_NAME=$AGFC_FRONTEND_NAME" >> "$GITHUB_ENV"

          echo $AGFC_ID
          echo $AGFC_FRONTEND_NAME

      - name: Create ingress for app
        run: |
          kubectl apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: cnapp-ingress
            namespace: $NAMESPACE
            annotations:
              alb.networking.azure.io/alb-id: $AGFC_ID
              alb.networking.azure.io/alb-frontend: $AGFC_FRONTEND_NAME
          spec:
            ingressClassName: azure-alb-external
            rules:
            - http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: frontend
                      port:
                        number: 3000
          EOF

          kubectl get ingress -n $NAMESPACE 

      - name: Curl test
        run: |
          kubectl run curl-test \
            --namespace "$NAMESPACE" \
            --rm \
            --attach \
            --image=curlimages/curl \
            --restart=Never \
            --command -- \
            curl -v http://frontend:3000