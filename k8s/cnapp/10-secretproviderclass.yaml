apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cnapp-backend-keyvault-secrets
  namespace: ${NAMESPACE}
spec:
  provider: azure
  parameters:
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${KEYVAULT_IDENTITY_CLIENT_ID}"
    keyvaultName: "${KEYVAULT_NAME}"
    tenantId: "${ARM_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: ${BACKEND_SECRET_NAME}
          objectType: secret
          objectAlias: backend-secret
        - |
          objectName: ${GOOGLE_SHEETS_WEB_APP_URL_SECRET_NAME}
          objectType: secret
          objectAlias: google-sheets-web-app-url
        - |
          objectName: ${GOOGLE_SHEETS_SHARED_SECRET_NAME}
          objectType: secret
          objectAlias: google-sheets-shared-secret
        - |
          objectName: ${RSVP_SESSION_SECRET_NAME}
          objectType: secret
          objectAlias: rsvp-session-secret
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cnapp-frontend-keyvault-secrets
  namespace: ${NAMESPACE}
spec:
  provider: azure
  parameters:
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${KEYVAULT_IDENTITY_CLIENT_ID}"
    keyvaultName: "${KEYVAULT_NAME}"
    tenantId: "${ARM_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: ${FRONTEND_SECRET_NAME}
          objectType: secret
          objectAlias: frontend-secret
